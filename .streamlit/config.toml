# Tema do painel (lido quando o Streamlit roda a partir da raiz do
# projeto,). Cor principal = o azul
# dos gráficos, em vez do vermelho padrão (que soa como alerta).
[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#f8f7fb"
secondaryBackgroundColor = "#efedf5"
textColor = "#292541"

# Site da Ciranda (app.py): Rede Ciranda e Apoio à mulher. A página do Apoio usa a barra dela, sem o menu automático.
[client]
showSidebarNavigation = false
